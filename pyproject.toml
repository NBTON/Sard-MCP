[project]
name = "sard-mcp"
version = "0.1.0"
description = "Local Saudi cultural evidence MCP server (Ministry of Culture demo)"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.65.0",
    "httpx>=0.28",
    "mcp>=1.12",
    "numpy>=2",
    "pdfplumber>=0.11",
    "pydantic>=2",
    "pypdf>=5",
    "pypdfium2>=4",
    "tiktoken>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sard_mcp"]

[project.scripts]
sard-mcp = "sard_mcp.server:main"
sard-import = "sard_mcp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
